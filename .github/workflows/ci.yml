name: Release

# 仅在新建 tag（v*）时触发构建；master 推送不再触发。
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write   # 创建 Release 及上传资源所需

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Enable git long paths (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure CMake (base)
        working-directory: cpp/emf-cpp
        run: >
          cmake -B build -S .
          -G "Ninja"
          -DCMAKE_BUILD_TYPE=Release
          -DEMF_BUILD_TESTS=ON
          -DEMF_BUILD_EXAMPLES=ON
          -DCMAKE_RUNTIME_OUTPUT_DIRECTORY=${{ github.workspace }}/cpp/emf-cpp/build/bin

      - name: Build base
        working-directory: cpp/emf-cpp
        run: cmake --build build --config Release --parallel

      - name: Test base
        working-directory: cpp/emf-cpp/build
        run: ctest --build-config Release --output-on-failure

      # ===== 用 artop 代码生成器从 autosar448.ecore 生成模型代码 =====
      # 输出落到 cpp/emf-cpp/emf-artop/autosar448-model/autosar40/（与底座放一起）
      - name: Generate ARTOP model code from autosar448.ecore
        working-directory: ${{ github.workspace }}
        run: >
          cpp/emf-cpp/build/bin/emf_artop_codegen
          models/autosar448/autosar448.ecore
          cpp/emf-cpp/emf-artop/autosar448-model
          --version=4.4.8

      # ===== 构建生成的模型代码工程（独立 CMake 工程，引用底座 build 目录）=====
      # 编译通过即表示“工程无报错”。
      - name: Configure model project
        working-directory: cpp/emf-cpp/emf-artop/autosar448-model
        run: >
          cmake -B build -S .
          -G "Ninja"
          -DCMAKE_BUILD_TYPE=Release
          -DEMF_CPP_BUILD_DIR=${{ github.workspace }}/cpp/emf-cpp/build

      - name: Build model project
        working-directory: cpp/emf-cpp/emf-artop/autosar448-model
        run: cmake --build build --config Release --parallel

      # ===== 打包底座 release：头文件 + 静态库 + codegen 可执行 =====
      - name: Stage base release
        shell: bash
        run: |
          set -e
          WS="${{ github.workspace }}"
          STAGE="$WS/staging-base"
          mkdir -p "$STAGE/include" "$STAGE/lib" "$STAGE/bin"
          # 头文件：各模块 include 目录
          for m in emf-common emf-ecore emf-ecore-util emf-xmi emf-xsd \
                   emf-compare emf-validation emf-sphinx emf-ecore-codegen \
                   emf-edit emf-artop/emf-artop-runtime emf-artop/emf-artop-codegen; do
            if [ -d "$WS/cpp/emf-cpp/$m/include" ]; then
              cp -r "$WS/cpp/emf-cpp/$m/include/." "$STAGE/include/"
            fi
          done
          # 静态库（Linux/MinGW 均为 .a）
          find "$WS/cpp/emf-cpp/build" -name '*.a' -exec cp {} "$STAGE/lib/" \;
          # codegen 可执行
          cp "$WS/cpp/emf-cpp/build/bin/emf_artop_codegen"* "$STAGE/bin/" 2>/dev/null || true
          echo "Base release staged:"
          find "$STAGE" -maxdepth 2 -type d | head -20

      - name: Package base release
        shell: bash
        run: |
          # 用 argv 传路径，避免 Windows 反斜杠路径在 Python 字符串字面量中被转义
          python -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', sys.argv[2])" \
            "emf-cpp-base-${{ matrix.os }}-${{ github.ref_name }}" \
            "${{ github.workspace }}/staging-base"
          ls -lh emf-cpp-base-*.zip

      # ===== 打包自包含模型工程（模型源码 + 底座头文件 + 预编译底座库）=====
      # 用户下载解压后可直接编译，无需另装底座。因预编译库与平台相关，每个平台各打一份。
      - name: Stage self-contained model project
        shell: bash
        run: |
          set -e
          WS="${{ github.workspace }}"
          STAGE="$RUNNER_TEMP/staging-model"
          rm -rf "$STAGE"
          mkdir -p "$STAGE"

          # 1) 底座头文件：按源码目录结构镜像（模型 CMakeLists 通过 ../../<module>/include 引用）
          for m in emf-common emf-ecore emf-ecore-util emf-xmi emf-xsd \
                   emf-compare emf-validation emf-sphinx emf-ecore-codegen \
                   emf-edit emf-artop/emf-artop-runtime emf-artop/emf-artop-codegen; do
            if [ -d "$WS/cpp/emf-cpp/$m/include" ]; then
              mkdir -p "$STAGE/$m"
              cp -r "$WS/cpp/emf-cpp/$m/include" "$STAGE/$m/include"
            fi
          done

          # 2) 预编译底座静态库（仅 .a，保留 build 子目录结构，供 EMF_CPP_BUILD_DIR 定位）
          mkdir -p "$STAGE/prebuilt"
          ( cd "$WS/cpp/emf-cpp/build" && find . -name '*.a' ) | while read -r f; do
            d="$STAGE/prebuilt/$(dirname "$f")"
            mkdir -p "$d"
            cp "$WS/cpp/emf-cpp/build/$f" "$d/"
          done

          # 3) 模型源码 + CMakeLists（排除模型自身的验证构建产物 build/）
          mkdir -p "$STAGE/emf-artop/autosar448-model"
          cp -r "$WS/cpp/emf-cpp/emf-artop/autosar448-model/." "$STAGE/emf-artop/autosar448-model/"
          rm -rf "$STAGE/emf-artop/autosar448-model/build"

          # 4) 顶层 CMakeLists：自动指定 EMF_CPP_BUILD_DIR，用户只需 cmake -B build -S .
          cat > "$STAGE/CMakeLists.txt" <<'CMEOF'
          cmake_minimum_required(VERSION 3.16)
          project(autosar448_sdk LANGUAGES CXX)
          set(CMAKE_CXX_STANDARD 17)
          set(CMAKE_CXX_STANDARD_REQUIRED ON)
          if(NOT CMAKE_BUILD_TYPE)
              set(CMAKE_BUILD_TYPE Release)
          endif()
          # 指向归档内预编译底座库，模型工程通过它链接底座静态库
          set(EMF_CPP_BUILD_DIR ${CMAKE_CURRENT_SOURCE_DIR}/prebuilt CACHE PATH "Pre-built emf-cpp base libs")
          add_subdirectory(emf-artop/autosar448-model)
          CMEOF

          # 5) 一键构建脚本（Linux 原生 bash / Windows Git Bash 均可）
          cat > "$STAGE/build.sh" <<'SHEOF'
          #!/usr/bin/env bash
          set -e
          HERE="$(cd "$(dirname "$0")" && pwd)"
          cd "$HERE/emf-artop/autosar448-model"
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DEMF_CPP_BUILD_DIR="$HERE/prebuilt"
          cmake --build build --config Release --parallel
          echo ""
          echo "Build succeeded: $HERE/emf-artop/autosar448-model/build/libautosar448_model.a"
          SHEOF
          chmod +x "$STAGE/build.sh"

          echo "Staged tree:"
          find "$STAGE" -maxdepth 2 -type d | sort | head -30

      # 配置期校验自包含工程可被 cmake 解析（不编译，仅验证路径/CMakeLists 正确）
      - name: Verify self-contained archive configures
        shell: bash
        run: |
          cmake -B "$RUNNER_TEMP/verify-cfg" -S "$RUNNER_TEMP/staging-model" -DCMAKE_BUILD_TYPE=Release 2>&1 | tail -8

      - name: Package self-contained model project
        shell: bash
        run: |
          python -c "import shutil, sys; shutil.make_archive(sys.argv[1], 'zip', sys.argv[2])" \
            "artop-model-autosar448-${{ matrix.os }}-${{ github.ref_name }}" \
            "$RUNNER_TEMP/staging-model"
          ls -lh artop-model-autosar448-*.zip

      - name: Upload base artifact
        uses: actions/upload-artifact@v4
        with:
          name: base-${{ matrix.os }}
          path: emf-cpp-base-*.zip
          retention-days: 7

      - name: Upload model artifact
        uses: actions/upload-artifact@v4
        with:
          name: model-autosar448-${{ matrix.os }}
          path: artop-model-autosar448-*.zip
          retention-days: 7

  release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: assets

      - name: List assets
        run: find assets -type f | sort

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ github.ref_name }}"
          # 收集所有 zip
          mkdir -p upload
          find assets -name '*.zip' -exec cp {} upload/ \;
          ls -lh upload/
          gh release create "$TAG" upload/*.zip \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
